org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official

# The version of the application, in one place.
#
# The release pipeline refuses to publish a tag that disagrees with this, so the
# name people quote and the number a device compares against cannot drift apart.
hava.versionName=1.2.2
hava.versionCode=6
