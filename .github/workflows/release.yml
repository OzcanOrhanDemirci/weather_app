name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish:
    name: Build, sign and publish
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # The tag is what people will quote, and the version inside the package is
      # what a device will compare against. A release where the two disagree is
      # worse than no release, so the pipeline refuses to publish one.
      - name: Check the tag against the declared version
        run: |
          declared=$(grep '^hava.versionName=' gradle.properties | cut -d= -f2)
          tagged="${GITHUB_REF_NAME#v}"
          if [ "$declared" != "$tagged" ]; then
            echo "Tag $GITHUB_REF_NAME does not match hava.versionName=$declared" >&2
            exit 1
          fi
          echo "Publishing $declared"

      - name: Restore the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.HAVA_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/hava-release.jks"

      - name: Run unit tests
        run: ./gradlew test --stacktrace

      - name: Assemble the signed release
        env:
          HAVA_KEYSTORE_FILE: ${{ runner.temp }}/hava-release.jks
          HAVA_KEYSTORE_PASSWORD: ${{ secrets.HAVA_KEYSTORE_PASSWORD }}
          HAVA_KEY_ALIAS: ${{ secrets.HAVA_KEY_ALIAS }}
          HAVA_KEY_PASSWORD: ${{ secrets.HAVA_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --stacktrace

      # A package signed with the debug key would install and run, and would
      # quietly be the wrong package. This confirms which key was used before
      # anything is published.
      - name: Confirm the release key was used
        run: |
          apksigner=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort | tail -1)
          "$apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk \
            | tee signing.txt
          grep -q "CN=Ozcan Orhan Demirci" signing.txt

      - name: Name the package after its version
        run: |
          version="${GITHUB_REF_NAME#v}"
          mv app/build/outputs/apk/release/app-release.apk "hava-$version.apk"
          ls -l "hava-$version.apk"

      # The notes on a release should be the ones written for that version by
      # hand, not a list of commit subjects assembled afterwards. They are in
      # the changelog already, so the pipeline reads them out of it, and a
      # version nobody wrote up there is not published at all.
      - name: Take the notes out of the changelog
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v heading="## [$version]" '
            index($0, heading) == 1 { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "CHANGELOG.md has no section for $version" >&2
            exit 1
          fi
          cat notes.md

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" "hava-$version.apk" \
            --title "Hava $version" \
            --notes-file notes.md \
            --verify-tag \
            --latest

      - name: Keep the mapping file
        uses: actions/upload-artifact@v7
        with:
          name: mapping-${{ github.ref_name }}
          path: app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: warn
          retention-days: 90

      - name: Remove the signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/hava-release.jks"
