# Keeps dependencies and workflow actions current.
#
# Updates are grouped so that a week of small bumps arrives as one pull request
# rather than a dozen. A pull request nobody reads is not maintenance, and a
# queue of them trains you to merge without looking.
#
# Every update still has to pass the verification pipeline before it can land,
# which is the point: the value is not in the bump, it is in finding out that
# the bump breaks the build while the change is still one line.
version: 2

updates:
  - package-ecosystem: gradle
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Europe/Istanbul
    open-pull-requests-limit: 5
    labels:
      - dependencies
    commit-message:
      prefix: build
      include: scope
    groups:
      androidx:
        patterns:
          - "androidx.*"
      kotlin-and-build-tools:
        patterns:
          - "org.jetbrains.kotlin*"
          - "com.google.devtools.ksp*"
          - "com.android.*"
      testing:
        patterns:
          - "io.kotest*"
          - "app.cash.turbine*"
          - "junit*"
          - "org.jetbrains.kotlinx:kotlinx-coroutines-test"

  # The convention plugins are a separate Gradle build and are not scanned by
  # the entry above.
  - package-ecosystem: gradle
    directory: "/build-logic"
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Europe/Istanbul
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - build
    commit-message:
      prefix: build
      include: scope

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Europe/Istanbul
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - ci
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions:
        patterns:
          - "*"
