name: Proposal
description: Something the application should do, or should do differently
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Proposals are welcome. The ones that get built are the ones that arrive
        with the reason attached, so the questions below ask for that rather
        than for a specification.

  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: >
        What is difficult, slow or impossible today. Describe the situation
        rather than the feature — the feature is the answer, and there may be a
        better one.
      placeholder: >
        I keep the same four cities and have to scroll past sixteen others to
        reach the last of them.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What you would like instead
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: What else you considered
      description: >
        Including doing nothing. If an existing part of the application almost
        solves it, say what stops it.

  - type: checkboxes
    id: constraints
    attributes:
      label: Constraints this project holds to
      description: >
        These are settled decisions rather than preferences, and a proposal that
        needs one of them lifted needs to say why it is worth it.
      options:
        - label: This does not need a server, an account or an API key
        - label: This does not need the device's location
        - label: This does not need a weather icon set
        - label: I have read the relevant entries in docs/decisions

  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: A sketch, a screenshot of another application, a link.
